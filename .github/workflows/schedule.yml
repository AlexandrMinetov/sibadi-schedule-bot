name: Schedule bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation
        type: choice
        options: [preview, poll, test, diagnose, publish_today]
        default: preview

permissions:
  contents: write

concurrency:
  group: schedule-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 -m py_compile bot.py
          python3 bot.py
      - name: Persist schedule state
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'publish_today' || inputs.mode == 'poll') }}
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update schedule state'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
