name: Schedule bot
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation
        type: choice
        options: [diagnose, chat_id, test, monitor]
        default: diagnose
permissions:
  contents: write
concurrency:
  group: schedule-bot
  cancel-in-progress: false
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MODE: ${{ inputs.mode || 'monitor' }}
        run: python3 bot.py
      - name: Save state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name 'schedule-bot'
            git config user.email 'schedule-bot@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update schedule state'
              git push
            fi
          fi
